name: Deploy to distribution ship
on:
  push:
    branches:
      - hd/cc-landing

env:
  DESK:      gw-btc
  DIST_PIER: ${{ vars.SPONSOR_URBIT_ID_NO_TILDE }}
  SCREEN:    sponsor
  SHIP_IP:   ${{ vars.SPONSOR_IP }}
  SHIP_HOST: root@${{ vars.SPONSOR_IP }}
  PIER_PATH: /root
  PIER:      sponsor

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: deploy (sponsor)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build desk
        run: make ${DESK}

      - name: Create desk.ship
        run: |
          printf '%s\n' "~${DIST_PIER}" > dist-${DESK}/desk.ship

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SPONSOR_VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${SHIP_IP} >> ~/.ssh/known_hosts

      # rsync does not create a mount point: the distribution ship must
      # already have the desk and have it mounted.  Check first and name
      # the fix, once, in the place someone will be looking.
      - name: Verify the desk is mounted on the distribution ship
        run: |
          if ! ssh ${SHIP_HOST} "test -d ${PIER_PATH}/${PIER}/${DESK}"; then
            echo "::error::%${DESK} is not mounted on ~${DIST_PIER}."
            echo "Run this once in the '${SCREEN}' screen session on ${SHIP_HOST}:"
            echo "    |new-desk %${DESK}"
            echo "    |mount %${DESK}"
            exit 1
          fi

      - name: Clear deployed desk
        run: ssh ${SHIP_HOST} "find ${PIER_PATH}/${PIER}/${DESK} -mindepth 1 -maxdepth 1 -exec rm -rf {} +"

      - name: Deploy desk
        run: |
          rsync -az --delete --exclude='.git*' \
            dist-${DESK}/ ${SHIP_HOST}:${PIER_PATH}/${PIER}/${DESK}/

      - name: Commit desk on ship
        run: |
          ssh ${SHIP_HOST} "screen -S ${SCREEN} -p 0 -X stuff $'|commit %${DESK}\r'"
